<!doctype html>
<html lang="en-GB">
    <head>
        <meta charset="utf-8" />
        <title>Table</title>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                background-color: #f5f5f5;
                font-family:
                    Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol';
                --font-family-serif: Helvetica;
                color: #291f42;
                font-weight: 400;
                line-height: 1.5;
                min-height: 100vh;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            * {
                width: 100%;
                height: 100%;
            }
        </style>
        <!-- The icon font of md-icon, which Studio's page loads. -->
        <link
            rel="preload"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@20..48,100..700,0..1"
            as="style"
            onload="this.onload=null;this.rel='stylesheet'"
        />
    </head>

    <body>
        <div id="demo"></div>
        <script src="https://storage.googleapis.com/reswarm-images/ObjectRandomizer.js"></script>

        <script type="module">
            import { render } from 'lit'
            import { html, unsafeStatic } from 'lit/static-html.js'
            import packageJson from '../package.json'
            import '../src/widget-table.ts'
            import data from '../src/default-data.json'
            import themeObject from './themes/light.json'

            // Demo-only additions (default-data.json seeds every new tile): a
            // link to a board page in the Link column, an edit column whose
            // values are the Name column's, the record key it hands over, and a
            // sort by State Map order, then the longest distance, then the
            // default config's newest Last Update.
            // Remove the parameterKey to see the disabled button and its tip.
            const columns = data.columns.map((col) => ({
                ...col,
                values: col.values.map((cell) => ({ ...cell }))
            }))
            columns[5].values[1].link = '/machines/mayflower'
            Object.assign(columns[0], { sortDirection: 'asc', sortPriority: 1 })
            Object.assign(columns[2], { sortDirection: 'desc', sortPriority: 2 })
            columns.push({
                header: 'Edit',
                type: 'edit',
                values: columns[1].values.map(({ value }) => ({ value })),
                styling: { parameterKey: 'edit' }
            })
            const demoData = { ...data, columns }

            const tag = unsafeStatic(`widget-table-${packageJson.version}`)
            const theme = { theme_name: 'light', theme_object: themeObject }
            render(
                html`
                    <${tag} .theme="${theme}" .inputData=${demoData}>
                        web component is not registered. Make sure to use the tag with the correct version
                        string from the package.json
                    </${tag}>
                `,
                document.getElementById('demo')
            )
            const widget = document.getElementById('demo').children[0]
            console.log('data', demoData)

            // A stand-in for Studio, which merges param-submit into the page URL
            // (undefined deletes a key) and opens the page a nav-submit names.
            widget.addEventListener('param-submit', (event) => {
                console.log('param-submit', event.detail.params)
                const url = new URL(location.href)
                for (const [key, value] of Object.entries(event.detail.params ?? {})) {
                    if (value === undefined || value === null) url.searchParams.delete(key)
                    else url.searchParams.set(key, value)
                }
                history.replaceState(null, '', url)
            })
            widget.addEventListener('nav-submit', (event) => console.log('nav-submit', event.detail.path))

            const keyPathsToRandomize = ['columns.1.values.0.value', 'columns.2.values.0.value']
            const inter = setInterval(() => {
                const randomizedObj = randomizeObjectValues(demoData, keyPathsToRandomize)

                // console.log('random', randomizedObj.dataseries[0].data[0])
                widget.inputData = randomizedObj
                // clearInterval(inter)
            }, 1000)
        </script>
    </body>
</html>
